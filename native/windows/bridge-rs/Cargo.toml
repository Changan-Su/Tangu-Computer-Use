[package]
name = "windows-bridge"
version = "0.1.0"
edition = "2021"
description = "Protocol skeleton for the tangu-computer-use Windows helper"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Tangu 新增:`#[implement]`(电脑历史的 UIA 事件处理器)展开后引用 windows_core,须直接依赖、版本与 windows 一致。
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[lib]
name = "windows_bridge"
path = "src/lib.rs"
