name: windows-checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'native/windows/bridge-rs/**'
      - 'scripts/**'
      - 'check.mjs'
      - 'package*.json'
      - '.github/workflows/windows-checks.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - name: Test native Windows helper
        run: cargo test --manifest-path native/windows/bridge-rs/Cargo.toml --locked
      - name: Build native Windows helper
        run: cargo build --release --manifest-path native/windows/bridge-rs/Cargo.toml --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bridge
          path: native/windows/bridge-rs/target/release/windows-bridge.exe
          if-no-files-found: error
