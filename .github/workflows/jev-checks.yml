name: jev-checks
on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'types/**', 'package*.json', '.github/workflows/jev-checks.yml']
  push:
    branches: ['codex/jev-computer-use']
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check:platform
      - run: npm run check:jev
