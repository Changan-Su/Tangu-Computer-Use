# 发布:打 v* tag → 在 macOS runner 构建 native helper + 插件 bundle → 传 GitHub Release + 发 npm。
# 手动触发(workflow_dispatch)= 演练:构建、自检、打包校验全跑,不建 Release、不发 npm。
#
# npm 走 trusted publishing(OIDC),仓库里**没有 npm 令牌**:npm 只认本仓 + 本文件名(release.yml)发来的请求。
# 首个版本必须人工发一次 —— npm 规定包存在后才能登记 trusted publisher(步骤见 README「发布」)。
# 包还不存在时 publish 步骤只告警、不变红;Release 上附的 .tgz 就是要人工发的那一份。
#
# ⚠️ 0.2.0 起本仓是 **Forsion 捆绑包**:npm 包 = 捆绑包的分发载体(市场/离线安装解包到 plugins/<id>/),
# **不再是能被 `tangu install` 直接装的独立引擎插件** —— 仓根已没有 tangu-plugin.json,
# 引擎侧内容在 tangu-plugins/computer-use/。
#
# ⚠️ 升级永不换 bundle id(com.forsion.tangu-computer-use)与签名身份 —— macOS 把辅助功能/录屏(TCC)
# 授权绑到它们,一换全体用户要重授权。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Windows helper(Rust UIA bridge)→ prebuilt/windows/windows-bridge.exe。cargo 在 windows-latest 预装。
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Build Windows helper
        run: node scripts/build-native.mjs --platform windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bridge
          path: prebuilt/windows/windows-bridge.exe
          if-no-files-found: error

  # Linux helper(Rust AT-SPI2/X11 bridge)→ prebuilt/linux/<arch>/linux-bridge。cargo 在 ubuntu runner 预装。
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Build Linux helper
        run: node scripts/build-native.mjs --platform linux --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bridge-${{ matrix.arch }}
          path: prebuilt/linux/${{ matrix.arch }}/linux-bridge
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: macos-14
    permissions:
      contents: write # 上传 Release 资产
      id-token: write # npm trusted publishing(OIDC)
    steps:
      - uses: actions/checkout@v4
      # ⚠️ 这里刻意不设 registry-url:setup-node 会往 .npmrc 写 `_authToken=${NODE_AUTH_TOKEN}` 并导出占位令牌,
      # npm 见到「已配令牌」就不走 OIDC,trusted publishing 以 ENEEDAUTH / E404 失败(npm/documentation#1960)。
      # npm 缺省源就是 registry.npmjs.org。
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # trusted publishing 要 npm ≥ 11.5.1 + Node ≥ 22.14
      # tag 与 package.json 版本对不上就别往下走:npm 版本不可变,发错只能 deprecate。
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm install --no-audit --no-fund

      # native macOS helper(Swift)→ prebuilt/macos/{arm64,x64}/bridge
      # 两个架构均构建完整 App 并封入 ZIP;签名只在构建期进行,安装器不接触用户钥匙串。
      - name: Build macOS helper (both architectures)
        run: npm run build:native -- --arch all

      # 发版前把「两个架构都在」变成硬门槛 —— 缺哪个都不该发出去
      - name: Verify macOS prebuilts
        run: node scripts/verify-macos-bundles.mjs

      # Windows helper(上一个 job 的产物)→ prebuilt/windows/windows-bridge.exe,一并打进 npm 包
      - name: Download Windows helper
        uses: actions/download-artifact@v4
        with:
          name: windows-bridge
          path: prebuilt/windows

      # Linux helper(上一个 job 的产物,两个架构)→ prebuilt/linux/<arch>/linux-bridge
      - name: Download Linux helpers
        uses: actions/download-artifact@v4
        with:
          pattern: linux-bridge-*
          path: ${{ runner.temp }}/linux
      - name: Place Linux helpers
        run: |
          set -e
          for arch in x64 arm64; do
            src="$RUNNER_TEMP/linux/linux-bridge-$arch/linux-bridge"
            test -f "$src"
            mkdir -p "prebuilt/linux/$arch"
            cp "$src" "prebuilt/linux/$arch/linux-bridge"
            chmod 755 "prebuilt/linux/$arch/linux-bridge"
          done

      # 插件 bundle → dist/index.js
      - name: Build plugin
        run: npm run build

      # 三平台自检(前台透明化判据 + helper 安装位置解析)
      - name: Checks
        run: npm run check

      # 包内容硬门禁:引擎入口、双架构 macOS App、Windows/Linux helper 缺一不发;版本号 manifest 与 package 一致。
      - name: Verify package contents
        run: node scripts/verify-package.mjs

      - name: Pack
        run: npm pack

      - name: Collect sealed helper app archives
        run: |
          for arch in arm64 x64; do
            cp "prebuilt/macos/$arch/tangu-computer-use.app.zip" "$RUNNER_TEMP/tangu-computer-use-$arch.app.zip"
          done

      # 先挂 Release 再发 npm:首个版本要人工发的 .tgz 就从这里下载,与自检过的字节是同一份。
      - name: Attach helpers and package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/tangu-computer-use-*.app.zip
            forsion-tangu-computer-use-*.tgz
          fail_on_unmatched_files: true

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name" name 2>&1 | grep -q E404; then
            echo "::warning::$name is not on npm yet. Publish the .tgz attached to this release once by hand, then register release.yml as its trusted publisher (README: Release)."
          else
            npm publish ./forsion-tangu-computer-use-*.tgz --access public
          fi

      # 大陆用户走 npmmirror,默认同步有分钟级延迟;这里催一下,失败不影响发布。
      - name: Ask npmmirror to sync
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: curl -fsS -X PUT "https://registry.npmmirror.com/-/package/%40forsion%2Ftangu-computer-use/syncs"
