# 发布:打 v* tag → 在 macOS runner 构建 native helper + 插件 bundle → 传 GitHub Release + 发 npm。
# 手动触发(workflow_dispatch)= 演练:构建、自检、打包校验全跑,不建 Release、不发 npm。
#
# npm 走 trusted publishing(OIDC),仓库里**没有 npm 令牌**:npm 只认本仓 + 本文件名(release.yml)发来的请求。
# 首个版本必须人工发一次 —— npm 规定包存在后才能登记 trusted publisher(步骤见 README「发布」)。
# 包还不存在时 publish 步骤只告警、不变红;Release 上附的 .tgz 就是要人工发的那一份。
#
# macOS helper 用项目的 Developer ID Application 证书签名(团队钉在 scripts/macos-bundle.mjs 的 releaseTeamId),
# 带加固运行时和安全时间戳 —— 随 Forsion Desktop 一起提交苹果公证时才过得去。macOS 把辅助功能 / 屏幕录制授权
# 绑在「bundle id + 团队」上,续期换证书不掉授权。需要仓库 secret:DEVELOPER_ID_P12(.p12 的 base64)与
# DEVELOPER_ID_P12_PASSWORD。私钥只在本 job 的临时钥匙串里,用户机器上的安装器只校验、复制,从不签名、不碰钥匙串。
# 旧的 CU_SIGNING_P12* 是 0.7.x 及以前的自签名证书,只留作备份,本流程不再用。
#
# ⚠️ 0.2.0 起本仓是 **Forsion 捆绑包**:npm 包 = 捆绑包的分发载体(市场/离线安装解包到 plugins/<id>/),
# **不再是能被 `tangu install` 直接装的独立引擎插件** —— 仓根已没有 tangu-plugin.json,
# 引擎侧内容在 tangu-plugins/computer-use/。
#
# ⚠️ 升级永不换 bundle id(com.forsion.tangu-computer-use)与签名团队 —— macOS 把辅助功能/录屏(TCC)
# 授权绑到它们,一换全体用户要重授权。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Windows helper(Rust UIA bridge)→ prebuilt/windows/windows-bridge.exe。cargo 在 windows-latest 预装。
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Build Windows helper
        run: node scripts/build-native.mjs --platform windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bridge
          path: prebuilt/windows/windows-bridge.exe
          if-no-files-found: error

  # Linux helper(Rust AT-SPI2/X11 bridge)→ prebuilt/linux/<arch>/linux-bridge。cargo 在 ubuntu runner 预装。
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Build Linux helper
        run: node scripts/build-native.mjs --platform linux --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bridge-${{ matrix.arch }}
          path: prebuilt/linux/${{ matrix.arch }}/linux-bridge
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: macos-15
    permissions:
      contents: write # 上传 Release 资产
      id-token: write # npm trusted publishing(OIDC)
    steps:
      - uses: actions/checkout@v4
      # ⚠️ 这里刻意不设 registry-url:setup-node 会往 .npmrc 写 `_authToken=${NODE_AUTH_TOKEN}` 并导出占位令牌,
      # npm 见到「已配令牌」就不走 OIDC,trusted publishing 以 ENEEDAUTH / E404 失败(npm/documentation#1960)。
      # npm 缺省源就是 registry.npmjs.org。
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # trusted publishing 要 npm ≥ 11.5.1 + Node ≥ 22.14
      # tag 与 package.json 版本对不上就别往下走:npm 版本不可变,发错只能 deprecate。
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm install --no-audit --no-fund

      # 临时钥匙串 + 分区列表放行 codesign:CI 上没人能点钥匙串授权框,不放行就会卡死在签名上。
      - name: Import release signing certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_P12" ] || [ -z "$DEVELOPER_ID_P12_PASSWORD" ]; then
            echo "::error::Missing DEVELOPER_ID_P12 / DEVELOPER_ID_P12_PASSWORD. An ad-hoc helper would cost every macOS user a new permission grant and fail Forsion Desktop notarization."
            exit 1
          fi
          keychain="$RUNNER_TEMP/cu-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cu-signing.p12"
          security import "$RUNNER_TEMP/cu-signing.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cu-signing.p12"
          # The runner may lack the Developer ID G2 intermediate; without it codesign cannot build the chain.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          team="$(node --input-type=module -e "const m = await import('./scripts/macos-bundle.mjs'); console.log(m.releaseTeamId)")"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -v t="($team)" 'index($0, "Developer ID Application:") && index($0, t) { print $2; exit }')"
          [ -n "$identity" ] || { echo "::error::The imported key is not a Developer ID Application identity of team $team"; exit 1; }
          echo "PI_COMPUTER_USE_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # native macOS helper(Swift)→ prebuilt/macos/{arm64,x64}/bridge
      # 两个架构均构建完整 App 并封入 ZIP;用上一步的 Developer ID 签名(PI_COMPUTER_USE_CODESIGN_IDENTITY),
      # 加固运行时 + 安全时间戳(公证的硬要求),安装器不接触用户钥匙串。
      - name: Build macOS helper (both architectures)
        run: npm run build:native -- --arch all --hardened-runtime --timestamp

      # 发版前把「两个架构都在」变成硬门槛 —— 缺哪个都不该发出去
      - name: Verify macOS prebuilts
        run: node scripts/verify-macos-bundles.mjs

      # Windows helper(上一个 job 的产物)→ prebuilt/windows/windows-bridge.exe,一并打进 npm 包
      - name: Download Windows helper
        uses: actions/download-artifact@v4
        with:
          name: windows-bridge
          path: prebuilt/windows

      # Linux helper(上一个 job 的产物,两个架构)→ prebuilt/linux/<arch>/linux-bridge
      - name: Download Linux helpers
        uses: actions/download-artifact@v4
        with:
          pattern: linux-bridge-*
          path: ${{ runner.temp }}/linux
      - name: Place Linux helpers
        run: |
          set -e
          for arch in x64 arm64; do
            src="$RUNNER_TEMP/linux/linux-bridge-$arch/linux-bridge"
            test -f "$src"
            mkdir -p "prebuilt/linux/$arch"
            cp "$src" "prebuilt/linux/$arch/linux-bridge"
            chmod 755 "prebuilt/linux/$arch/linux-bridge"
          done

      # 插件 bundle → dist/index.js
      - name: Build plugin
        run: npm run build

      # 三平台自检(前台透明化判据 + helper 安装位置解析)
      - name: Checks
        run: npm run check

      # 包内容硬门禁:引擎入口、双架构 macOS App、Windows/Linux helper 缺一不发;版本号 manifest 与 package 一致。
      - name: Verify package contents
        run: node scripts/verify-package.mjs

      - name: Pack
        run: npm pack

      # Keep manual dry-run packages downloadable without publishing a release.
      - name: Upload verified development package
        uses: actions/upload-artifact@v4
        with:
          name: computer-use-package
          path: forsion-tangu-computer-use-*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Collect sealed helper app archives
        run: |
          for arch in arm64 x64; do
            cp "prebuilt/macos/$arch/tangu-computer-use.app.zip" "$RUNNER_TEMP/tangu-computer-use-$arch.app.zip"
          done

      # 先挂 Release 再发 npm:首个版本要人工发的 .tgz 就从这里下载,与自检过的字节是同一份。
      - name: Attach helpers and package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/tangu-computer-use-*.app.zip
            forsion-tangu-computer-use-*.tgz
          fail_on_unmatched_files: true

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name" name 2>&1 | grep -q E404; then
            echo "::warning::$name is not on npm yet. Publish the .tgz attached to this release once by hand, then register release.yml as its trusted publisher (README: Release)."
          else
            npm publish ./forsion-tangu-computer-use-*.tgz --access public
          fi

      # 大陆用户走 npmmirror,默认同步有分钟级延迟;这里催一下,失败不影响发布。
      - name: Ask npmmirror to sync
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: curl -fsS -X PUT "https://registry.npmmirror.com/-/package/%40forsion%2Ftangu-computer-use/syncs"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/cu-signing.keychain-db" 2>/dev/null || true
